name: Mirror ORC certificates

on:
  schedule:
    - cron: "0 3 * * *"   # daily 03:00 UTC
  workflow_dispatch:
    inputs:
      countries:
        description: "Space-separated country codes (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: orc-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout published site (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true   # first run: branch doesn't exist yet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest -q tests/test_mirror.py

      - name: Mirror
        run: |
          rm -rf site/.git
          python mirror.py --out site ${{ inputs.countries && format('--countries {0}', inputs.countries) || '' }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true          # never delete older certificate revisions
          force_orphan: false
          user_name: orc-mirror-bot
          user_email: orc-mirror-bot@users.noreply.github.com
          commit_message: "mirror: ${{ github.run_id }}"
